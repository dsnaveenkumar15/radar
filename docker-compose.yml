services:
  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      - DB_PATH=/data/radar.db
      - DATA_ROOT=/data/published
      - PLANETS=radar
      - TRUST_PROXY=1
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - data:/data
    restart: unless-stopped
    # Hardened: no privilege escalation, no Linux capabilities, read-only image; only /data and /tmp are writable.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s     # check every 2 s while starting, so Traefik routes to it within seconds
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - default
      - ai
    labels:
      - traefik.enable=true
      - traefik.http.routers.radar.rule=Host(`${RADAR_HOST:-radar.naveenlabs.tech}`)
      - traefik.http.routers.radar.entrypoints=websecure
      - traefik.http.routers.radar.tls.certresolver=letsencrypt
      - traefik.http.services.radar.loadbalancer.server.port=8000

  batch:
    build:
      context: .
      target: batch
    env_file:
      - .env
      - batch.env
    environment:
      - DB_PATH=/data/radar.db
      - DATA_ROOT=/data/published
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - data:/data
    restart: unless-stopped
    # The CLI writes its own config under the home directory, so the batch image stays writable; it still gets no privileges.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    networks:
      - default
      - ai

networks:
  ai:
    external: true
    name: naveenlabs-ai_default

volumes:
  data:
